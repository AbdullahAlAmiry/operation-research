<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Research – Question Bank</title><style>
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;max-width:820px;margin:auto;padding:14px;background:#f5f7fa;color:#1d2733}
h1{font-size:20px;margin:6px 0}h2{background:#1f4e79;color:#fff;padding:8px 12px;border-radius:8px;margin-top:26px;font-size:16px}
.note{direction:rtl;text-align:right;background:#fff7e0;border-right:4px solid #e0a800;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px}
.q{background:#fff;border:1px solid #dde3ea;border-radius:10px;padding:12px;margin:12px 0}
.en{font-weight:600}.ar{direction:rtl;text-align:right;color:#4a5a6a;margin:4px 0 8px}
label.o{display:block;padding:8px 10px;margin:5px 0;border:1px solid #ccd5df;border-radius:8px;cursor:pointer}
label.o:hover{background:#eef3f8}
.ok{background:#d4f4dd!important;border-color:#2e9e4f!important}.no{background:#fbd5d5!important;border-color:#d03a3a!important}
.fb{display:none;direction:rtl;text-align:right;margin-top:8px;padding:8px 10px;border-radius:8px;background:#eef3f8;font-size:14px;line-height:1.6}
.q.done .fb{display:block}.tf{display:flex;gap:10px}.tf label.o{flex:1;text-align:center}
#score{position:sticky;top:0;background:#1f4e79;color:#fff;padding:6px 12px;border-radius:8px;text-align:center;z-index:5}
</style></head><body>
<h1>Operations Research (BAS212) – Question Bank</h1><div id="score"></div><div id="app"></div>
<script>
const A=document.getElementById('app'),S=document.getElementById('score');let c=0,t=0;
const upd=()=>S.textContent=`Score: ${c} / ${t} answered`;upd();
function sec(title,note){const h=document.createElement('h2');h.textContent=title;A.append(h);if(note){const n=document.createElement('div');n.className='note';n.innerHTML=note;A.append(n)}}
function fin(q,ok,msg,d){q.classList.add('done');q.querySelector('.fb').innerHTML=(ok?'✅ إجابة صحيحة. ':'❌ إجابة خاطئة. ')+msg+d;q.querySelectorAll('input').forEach(x=>x.disabled=true);t++;if(ok)c++;upd()}
function choice(data,start,id){data.forEach((d,i)=>{const q=document.createElement('div');q.className='q';
q.innerHTML=`<div class="en">${start+i}. ${d[0]}</div><div class="ar">${d[1]}</div>`+d[2].map((o,j)=>`<label class="o"><input type="radio" name="${id}${i}" value="${j}"> ${'ABCD'[j]}. ${o}</label>`).join('')+'<div class="fb"></div>';
q.onchange=e=>{if(q.classList.contains('done'))return;const v=+e.target.value,L=q.querySelectorAll('label.o');L[d[3]].classList.add('ok');if(v!==d[3])L[v].classList.add('no');fin(q,v===d[3],v===d[3]?'':`الإجابة الصحيحة: <b dir="ltr">${d[2][d[3]]}</b><br>`,d[4])};A.append(q)})}
function tf(data,start){data.forEach((d,i)=>{const q=document.createElement('div');q.className='q';
q.innerHTML=`<div class="en">${start+i}. ${d[0]}</div><div class="ar">${d[1]}</div><div class="tf"><label class="o"><input type="checkbox" value="1"> ✓ True / صح</label><label class="o"><input type="checkbox" value="0"> ✗ False / خطأ</label></div><div class="fb"></div>`;
q.onchange=e=>{if(q.classList.contains('done'))return;const v=+e.target.value,L=q.querySelectorAll('label.o'),ix=v?0:1;L.forEach((l,k)=>{if(k!==ix)l.querySelector('input').checked=false});
L[d[2]?0:1].classList.add('ok');if(v!==d[2])L[ix].classList.add('no');fin(q,v===d[2],v===d[2]?'':`الإجابة الصحيحة: <b>${d[2]?'صح (True)':'خطأ (False)'}</b><br>`,d[3])};A.append(q)})}
const D0=[["What is the primary goal of Operations Research?", "ما الهدف الأساسي من بحوث العمليات؟", ["To support better decision-making using analytical methods", "To maximize the number of variables", "To replace human decision-makers", "To eliminate all constraints in a system"], 0, "بحوث العمليات تدعم اتخاذ قرارات أفضل بالأساليب التحليلية والرياضية، ولا تستبدل متخذ القرار ولا تلغي القيود."], ["Which of the following best describes a mathematical model in OR?", "أي مما يلي يصف النموذج الرياضي في بحوث العمليات؟", ["A simplified representation of a real-world problem using mathematical relationships", "A physical replica of a real system", "A random guess about the future", "A computer hardware component"], 0, "النموذج الرياضي تمثيل مبسط لمشكلة حقيقية بعلاقات رياضية، وليس نسخة مادية ولا تخمينا."], ["What is the first step in the OR methodology?", "ما أول خطوة في منهجية بحوث العمليات؟", ["Define Problem", "Solve Model", "Validate Model", "Implement Solution"], 0, "الخطوات بالترتيب: تحديد المشكلة ← بناء النموذج ← حل النموذج ← التحقق ← التطبيق. فالأولى هي Define Problem."], ["Which step of the OR methodology comes immediately after \"Solve Model\"?", "أي خطوة تأتي مباشرة بعد \"حل النموذج\" في المنهجية؟", ["Validate Model", "Define Problem", "Implement Solution", "Identify Variables"], 0, "بعد الحل نتحقق من النموذج (Validate) ثم نطبق الحل."], ["In the OR methodology, what is the primary purpose of the \"Validate Model\" step?", "ما الغرض الأساسي من خطوة \"التحقق من النموذج\"؟", ["To find the optimal solution using algorithms", "To identify the decision variables", "To ensure the model accurately reflects the real-world problem", "To apply the solution to the actual system"], 2, "التحقق = التأكد أن النموذج يعكس المشكلة الحقيقية. إيجاد الحل هو Solve، والتطبيق هو Implement."], ["Which of the following is a limitation of OR models?", "أي مما يلي من عيوب نماذج بحوث العمليات؟", ["They are always 100% accurate", "They are simplifications and may not fit real-world assumptions perfectly", "They do not require any data", "They cannot handle any constraints"], 1, "النماذج تبسيط للواقع وقد لا تطابق افتراضاتها الواقع تماما. أما أنها دقيقة 100% أو لا تحتاج بيانات فخطأ."], ["Which of the following is a benefit of using OR?", "أي مما يلي من مزايا استخدام بحوث العمليات؟", ["It guarantees perfect decisions every time", "It requires no data", "It provides a framework for handling complex, large-scale problems", "It eliminates all uncertainty"], 2, "من المزايا: إطار للتعامل مع المشاكل الكبيرة المعقدة. أما ضمان قرارات مثالية أو إزالة عدم اليقين فمبالغات خاطئة."], ["Which of the following is NOT a common OR model type?", "أي مما يلي ليس من أنواع نماذج بحوث العمليات الشائعة؟", ["Organic Chemistry Models", "Linear Programming", "Queuing Models", "Simulation"], 0, "نماذج الكيمياء العضوية ليست من نماذج OR. الباقي: برمجة خطية وطوابير ومحاكاة."], ["Which of the following is NOT an assumption of linear programming models?", "أي مما يلي ليس افتراضا من افتراضات نماذج البرمجة الخطية؟", ["Additivity", "Divisibility", "Uncertainty", "Proportionality"], 2, "الافتراضات: التناسب والجمع والقابلية للقسمة والتأكد (Certainty). فعدم التأكد (Uncertainty) ليس افتراضا."], ["What does a constraint represent in an optimization problem?", "ماذا يمثل القيد في مسألة التحسين؟", ["A decision variable", "The optimal solution", "The goal of the problem", "A limitation or requirement on resources"], 3, "القيد حد أو متطلب على الموارد. المتغير هو ما نتحكم فيه، والهدف هو ما نريد تعظيمه أو تقليله."], ["What is a decision variable in an LP model?", "ما متغير القرار في نموذج البرمجة الخطية؟", ["The unknown quantity the decision-maker controls (Variables that define the problem's solution)", "A constraint", "A fixed constant", "The objective function"], 0, "متغير القرار هو الكمية المجهولة التي يتحكم فيها متخذ القرار، والثابت يسمى معامل أو Parameter."], ["In OR, what is an objective function?", "ما دالة الهدف في بحوث العمليات؟", ["A decision variable", "A non-negativity restriction", "A mathematical expression to be maximized or minimized", "A constraint that limits resources"], 2, "دالة الهدف تعبير رياضي نريد تعظيمه (ربح) أو تقليله (تكلفة)."], ["Which of the following is a correct general form of an LP objective function?", "أي مما يلي الصيغة العامة الصحيحة لدالة الهدف في LP؟", ["Maximize Z = X₁ × X₂ × … × Xₙ", "Maximize Z = c₁X₁ + c₂X₂ + … + cₙXₙ", "Maximize Z = X₁² + X₂²", "Maximize Z = log(X₁) + log(X₂)"], 1, "في LP الدالة خطية: مجموع (معامل × متغير). الضرب والتربيع واللوغاريتم دوال غير خطية."], ["What does the \"non-negativity\" restriction in a linear programming model imply?", "ماذا يعني شرط \"عدم السالبية\" في نموذج البرمجة الخطية؟", ["All decision variables must be integers", "All decision variables must be zero", "All decision variables must be negative", "All decision variables must be greater than or equal to zero (≥ 0)"], 3, "عدم السالبية: كل المتغيرات أكبر من أو تساوي صفر. لا علاقة له بكونها أعداد صحيحة."]];
sec("Part 1 · OR Basics & LP Modeling","الجزء 1: أساسيات بحوث العمليات ونمذجة البرمجة الخطية — اختر الإجابة؛ تظهر الصحيحة بالأخضر والخاطئة بالأحمر مع الشرح.");choice(D0,1,'a');
const D1=[["A company produces chairs (C) and tables (T). Each chair requires 2 units of wood and each table requires 5 units of wood. There are 200 units of wood available. Which constraint is correct?", "شركة تنتج كراسي (C) وطاولات (T). الكرسي يحتاج وحدتين خشب والطاولة 5 وحدات، والمتاح 200 وحدة. أي قيد صحيح؟", ["2C + 5T ≤ 200", "C + T ≤ 200", "5C + 2T ≤ 200", "2C + 5T ≥ 200"], 0, "الخشب المستخدم 2C + 5T يجب ألا يتجاوز المتاح، فالإشارة ≤."], ["A factory has 100 hours of labor available. Product A requires 2 hours per unit and Product B requires 3 hours per unit. Which constraint represents this?", "مصنع لديه 100 ساعة عمل. المنتج A يحتاج ساعتين والمنتج B 3 ساعات. أي قيد يمثل ذلك؟", ["2A + 3B ≥ 100", "2A + 3B ≤ 100", "3A + 2B ≤ 100", "A + B ≤ 100"], 1, "ساعات العمل = 2A + 3B وهي حد أقصى فـ ≤ 100."], ["A company produces two products, A and B. Each unit of A requires 3 hours of labor and each unit of B requires 2 hours. There are 120 hours of labor available. Which constraint represents this?", "شركة تنتج A و B. وحدة A تحتاج 3 ساعات و B ساعتين، والمتاح 120 ساعة. أي قيد يمثل ذلك؟", ["2A + 3B ≤ 120", "3A + 2B ≤ 120", "A + B ≤ 120", "3A + 2B ≥ 120"], 1, "معامل كل منتج هو ساعاته: 3A + 2B ≤ 120. انتبه لعدم عكس المعاملات كما في الخيار A."], ["A diet problem requires at least 50 units of vitamin C and at least 30 units of vitamin D. Food A provides 10 units of C and 5 units of D per serving. Food B provides 5 units of C and 10 units of D per serving. Which constraint represents the vitamin C requirement?", "مسألة غذاء تتطلب على الأقل 50 وحدة فيتامين C و30 وحدة فيتامين D. الغذاء A يعطي 10 C و5 D والغذاء B يعطي 5 C و10 D. أي قيد يمثل متطلب فيتامين C؟", ["10A + 5B ≥ 50", "10A + 5B ≤ 50", "5A + 10B ≥ 30", "10A + 10B ≥ 50"], 0, "فيتامين C من A هو 10 ومن B هو 5، و\"على الأقل\" تعني ≥. الخيار C خاص بفيتامين D."], ["A test has two types of questions: Type A is worth 10 points and takes 4 minutes, Type B is worth 20 points and takes 8 minutes. The total time allowed is 80 minutes. If x is the number of Type A questions and y is the number of Type B questions, which constraint represents the time limit?", "اختبار فيه نوعان: A بـ 10 درجات و4 دقائق، و B بـ 20 درجة و8 دقائق، والزمن الكلي 80 دقيقة. إذا كان x عدد أسئلة A و y عدد أسئلة B فأي قيد يمثل الزمن؟", ["8x + 4y ≤ 80", "10x + 20y ≤ 80", "4x + 8y ≥ 80", "4x + 8y ≤ 80"], 3, "الزمن = 4x + 8y وهو حد أقصى فـ ≤ 80. الدرجات لا تدخل في قيد الزمن."], ["A company must produce at least 20 units of Product A and at least 30 units of Product B. Which set of constraints represents this?", "على الشركة إنتاج 20 وحدة على الأقل من A و30 وحدة على الأقل من B. أي مجموعة قيود تمثل ذلك؟", ["A ≥ 30, B ≥ 20", "A ≤ 20, B ≤ 30", "A ≥ 20, B ≥ 30", "A + B ≥ 50"], 2, "\"على الأقل\" = ≥ لكل منتج على حدة: A ≥ 20 و B ≥ 30. الخيار D يجمعهما ولا يحقق الشرطين منفصلين."], ["A company must produce at least 15 units of Product X and no more than 40 units of Product Y. Which set of constraints represents this?", "على الشركة إنتاج 15 وحدة على الأقل من X وألا تزيد عن 40 وحدة من Y. أي مجموعة قيود تمثل ذلك؟", ["X ≥ 15, Y ≤ 40", "X ≤ 15, Y ≤ 40", "X ≤ 15, Y ≥ 40", "X ≥ 15, Y ≥ 40"], 0, "\"على الأقل\" ← ≥ و\"لا تزيد عن\" ← ≤: X ≥ 15 و Y ≤ 40."], ["A furniture company makes tables (T) and chairs (C). Each table requires 4 units of wood and each chair requires 1 unit. There are 60 units of wood available. The company must produce at least 5 tables. Which of the following is the correct set of constraints?", "شركة أثاث تصنع طاولات (T) وكراسي (C). الطاولة تحتاج 4 وحدات خشب والكرسي وحدة، والمتاح 60 وحدة، ويجب إنتاج 5 طاولات على الأقل. أي مجموعة قيود صحيحة؟", ["4T + C ≥ 60, T ≥ 5", "4T + C ≤ 60, T ≥ 5", "4T + C ≤ 60, T ≤ 5", "T + 4C ≤ 60, T ≤ 5"], 1, "الخشب: 4T + C ≤ 60 (حد أقصى)، والحد الأدنى للطاولات: T ≥ 5."], ["A company wants to minimize cost. Product X costs $4 per unit and Product Y costs $7 per unit. What is the objective function?", "شركة تريد تقليل التكلفة. المنتج X تكلفته 4 دولار والمنتج Y 7 دولار للوحدة. ما دالة الهدف؟", ["Minimize Z = 4X + 7Y", "Maximize Z = X + Y", "Maximize Z = 4X + 7Y", "Minimize Z = 7X + 4Y"], 0, "تقليل التكلفة ← Minimize، ومعامل كل متغير هو تكلفته: 4X + 7Y."], ["A farmer wants to minimize the cost of fertilizer. Brand X costs $5 per bag and Brand Y costs $8 per bag. What is the objective function?", "مزارع يريد تقليل تكلفة السماد. النوع X بـ 5 دولار للكيس والنوع Y بـ 8 دولار. ما دالة الهدف؟", ["Maximize Z = 5X + 8Y", "Minimize Z = 5X + 8Y", "Maximize Z = X + Y", "Minimize Z = 8X + 5Y"], 1, "الهدف تقليل تكلفة: Minimize Z = 5X + 8Y."], ["A company produces two products, X and Y. Each unit of X gives a profit of $5 and each unit of Y gives a profit of $8. The company wants to maximize profit. What is the objective function?", "شركة تنتج X و Y. ربح وحدة X هو 5 دولار وربح وحدة Y هو 8 دولار، وتريد تعظيم الربح. ما دالة الهدف؟", ["Maximize Z = 5X + 8Y", "Minimize Z = 5X + 8Y", "Maximize Z = X + Y", "Maximize Z = 8X + 5Y"], 0, "تعظيم الربح ← Maximize Z = 5X + 8Y."]];
sec("Part 2 · Problem Formulation","الجزء 2: صياغة المسائل (القيود ودوال الهدف) — انتبه لـ \"على الأقل\" = ≥ و\"على الأكثر\" = ≤، وإلى ترتيب المعاملات.");choice(D1,15,'b');
const D2=[["What is the difference between a feasible solution and an optimal solution?", "ما الفرق بين الحل الممكن (Feasible) والحل الأمثل (Optimal)؟", ["Optimal satisfies all constraints; feasible is the best solution", "Feasible satisfies all constraints; optimal is the best feasible solution", "Feasible violates constraints; optimal does not", "They are the same thing"], 1, "الممكن يحقق كل القيود، والأمثل هو أفضل حل ممكن (أكبر أو أقل قيمة للهدف)."], ["A solution that satisfies all constraints of a linear programming model is called:", "الحل الذي يحقق كل قيود نموذج البرمجة الخطية يسمى:", ["An optimal solution", "A feasible solution", "An infeasible solution", "An unbounded solution"], 1, "تحقيق كل القيود يجعله حلا ممكنا (Feasible)، وليس بالضرورة الأمثل."], ["In the graphical LP, how is the feasible region determined?", "في الحل البياني، كيف تتحدد منطقة الحلول الممكنة؟", ["Random choice of variables", "Objective function alone", "Unbounded solutions", "Intersection of all constraints"], 3, "المنطقة الممكنة هي تقاطع كل المناطق التي يحققها كل قيد (مع عدم السالبية)."], ["What does the graphical solution determine?", "ماذا يحدد الحل البياني؟", ["Optimum solution from among all the points in the solution space", "All of them", "Feasible solution space", "None of them"], 0, "حسب مفتاح البنك: الحل البياني يحدد الحل الأمثل من بين كل نقاط فضاء الحل. (سؤال يمكن مناقشة خيار B فيه، لكن المفتاح A.)"], ["In the graphical method, the optimal solution to a linear programming problem is always found at:", "في الطريقة البيانية، يوجد الحل الأمثل دائما عند:", ["The center of the feasible region", "The origin (0,0)", "A corner point (extreme point) of the feasible region", "Any point on the boundary of the feasible region"], 2, "الأمثل دائما عند ركن (نقطة متطرفة) من المنطقة الممكنة. لذلك نحسب Z عند كل ركن."], ["When solving a minimization problem graphically, the optimal solution is found by:", "عند حل مسألة تقليل بيانيا، نجد الحل الأمثل عن طريق:", ["Finding the corner point with the lowest Z value", "Finding the center of the feasible region", "Finding the corner point with the highest Z value", "Finding the point where the objective function line is farthest from the origin"], 0, "في Min نأخذ الركن الذي له أقل قيمة لـ Z، وفي Max الركن الأكبر."], ["What is the primary limitation of the graphical method for solving linear programming problems?", "ما القيد الأساسي على الطريقة البيانية؟", ["It requires the simplex method to find the final answer", "It is limited to problems with only two decision variables", "It can only solve maximization problems", "It cannot handle non-negativity constraints"], 1, "الرسم يعمل لمتغيرين فقط (ثلاثة بصعوبة)، أما المسائل الأكبر فتحتاج السمبلكس."], ["Consider a maximization LP with constraints x ≤ 10, y ≤ 8, and x + y ≤ 15. Which of the following points is NOT a corner point of the feasible region?", "في مسألة تعظيم قيودها x ≤ 10 و y ≤ 8 و x + y ≤ 15، أي النقاط التالية ليست ركنا في المنطقة الممكنة؟", ["(10, 0)", "(0, 0)", "(7, 8)", "(10, 8) (Note: 10 + 8 = 18 > 15, violates the third constraint)"], 3, "النقطة (10,8) مجموعها 18 أكبر من 15 فهي تخالف القيد الثالث وليست حتى حلا ممكنا. الأركان الحقيقية: (0,0) و(10,0) و(10,5) و(7,8) و(0,8)."], ["Consider the following LP problem: Min Z = 2x₁ + x₂ subject to x₁ ≤ 1, x₁ + 2x₂ ≤ 10, x₁ − 2x₂ ≥ −1, and x₁, x₂ ≥ 0. Which solution is feasible?", "في المسألة: Min Z = 2x₁ + x₂ بقيود x₁ ≤ 1 و x₁ + 2x₂ ≤ 10 و x₁ − 2x₂ ≥ −1 و x₁, x₂ ≥ 0. أي حل ممكن؟", ["None of the above", "(1, 0) (Note: 1 ≤ 1, 1 + 0 ≤ 10, and 1 − 0 ≥ −1)", "Both A and B", "(3, 4)"], 1, "عوّض: (1,0) يحقق 1 ≤ 1 و 1 ≤ 10 و 1 ≥ −1 ✓. أما (3,4) فيخالف x₁ ≤ 1."], ["What happens if a linear programming problem has multiple optimal solutions?", "ماذا يحدث إذا كان لمسألة البرمجة الخطية حلول مثلى متعددة؟", ["The problem cannot be solved", "Any of the optimal solutions can be chosen", "The objective function value is unbounded", "The problem is infeasible"], 1, "كلها تعطي نفس قيمة Z المثلى، فيمكن اختيار أي منها."], ["If a linear programming problem has multiple optimal solutions, what is true about the objective function line?", "إذا كان للمسألة حلول مثلى متعددة فماذا نقول عن خط دالة الهدف؟", ["It is parallel to one of the constraint lines", "It passes through the origin", "It does not touch the feasible region", "It is perpendicular to one of the constraint lines"], 0, "خط الهدف يكون موازيا لأحد خطوط القيود، فتكون Z ثابتة على القطعة بأكملها (مثل الفخار بهدف 40x₁+30x₂)."], ["An infeasible linear programming problem is one where:", "المسألة غير الممكنة (Infeasible) هي التي:", ["There are multiple optimal solutions", "The objective function can increase indefinitely", "No solution satisfies all constraints simultaneously", "The feasible region is unbounded"], 2, "لا يوجد حل يحقق كل القيود معا (لا توجد منطقة مشتركة)."], ["An unbounded solution in a linear programming problem means that:", "الحل غير المحدود (Unbounded) يعني أن:", ["The objective function can increase (or decrease) indefinitely without reaching a maximum (or minimum)", "The feasible region is a closed polygon", "The problem has multiple optimal solutions", "There is no feasible region"], 0, "دالة الهدف تزيد (أو تنقص) إلى ما لا نهاية دون الوصول لقيمة قصوى (أو دنيا)."], ["An unbounded solution typically indicates:", "الحل غير المحدود يدل عادة على:", ["Infeasibility", "Missing constraints in the model", "Degeneracy in the solution", "A unique optimal solution"], 1, "غالبا يعني أن النموذج ينقصه قيد (مورد لم يتم تقييده)."]];
